<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Front desk | Maison Aurelia</title><link rel="stylesheet" href="style.css">
<style>table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #d5e2de;font-size:.92rem}th{color:var(--muted)}.wrap{overflow:auto;padding:12px}select{padding:8px}</style></head>
<body><div class="orb o1"></div><div class="orb o2"></div>
<header class="nav"><a class="brand" href="/">Maison Aurelia</a><span class="muted">Front desk</span></header>
<main class="section"><h2>Bookings</h2><form id="k" class="card lookup" style="grid-template-columns:1fr auto"><input id="key" type="password" placeholder="Admin key" required><button class="btn">Load</button></form><p class="msg" id="m"></p>
<div class="card wrap" id="t" hidden><table><thead><tr><th>Ref</th><th>Guest</th><th>Room</th><th>Stay</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table></div><h2 style="margin-top:36px">Kitchen orders</h2><div class="card wrap" id="ot" hidden><table><thead><tr><th>Order</th><th>Guest</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="ob"></tbody></table></div></main>
<script>
const $=s=>document.querySelector(s),H=()=>({'x-admin-key':$('#key').value,'Content-Type':'application/json'}),S=['CONFIRMED','CHECKED_IN','CHECKED_OUT','CANCELLED','NO_SHOW'],e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const r=await fetch('/api/admin/bookings',{headers:H()}),j=await r.json();if(!r.ok){$('#m').textContent=j.error;return}$('#m').textContent='';$('#t').hidden=false;
$('tbody').innerHTML=j.bookings.length?j.bookings.map(b=>`<tr><td>${b.reference}</td><td>${e(b.guest)}<br><small class="muted">${e(b.email)}</small></td><td>${e(b.roomName)} #${b.room}</td><td>${b.checkIn} to ${b.checkOut}</td><td>$${b.pricing.total}</td><td><select data-r="${b.reference}">${S.map(s=>`<option ${s==b.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No bookings yet.</td></tr>'}
$('#k').onsubmit=ev=>{ev.preventDefault();load();loadOrders();setInterval(loadOrders,5000)};
$('tbody').onchange=async ev=>{await fetch(`/api/admin/bookings/${ev.target.dataset.r}/status`,{method:'POST',headers:H(),body:JSON.stringify({status:ev.target.value})})};
const OS=['RECEIVED','PREPARING','READY','DELIVERED','CANCELLED'];let last='';
async function loadOrders(){const r=await fetch('/api/admin/orders',{headers:H()});if(!r.ok)return;const j=await r.json(),s=JSON.stringify(j.orders);if(s===last)return;last=s;$('#ot').hidden=false;
$('#ob').innerHTML=j.orders.length?j.orders.map(o=>`<tr><td>${o.reference}</td><td>${e(o.guest)}<br><small class="muted">${o.room?'Room '+o.room:'Pickup'}</small></td><td>${o.lines.map(l=>l.qty+' x '+e(l.name)).join('<br>')}${o.note?'<br><small class="muted">Note: '+e(o.note)+'</small>':''}</td><td>$${o.pricing.total}</td><td><select data-o="${o.reference}">${OS.map(x=>`<option ${x==o.status?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No orders yet.</td></tr>'}
$('#ob').onchange=async ev=>{await fetch(`/api/admin/orders/${ev.target.dataset.o}/status`,{method:'POST',headers:H(),body:JSON.stringify({status:ev.target.value})});last='';loadOrders()};
</script></body></html>
