<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Front desk | Aurelia Grand</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #d5e2de;
            font-size: .92rem
        }

        th {
            color: var(--muted)
        }

        .wrap {
            overflow: auto;
            padding: 12px
        }

        select {
            padding: 8px
        }
    </style>
</head>

<body class="admin-page">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <header class="nav"><a class="brand brand-lockup" href="/" aria-label="Aurelia Grand home"><span class="brand-name">Aurelia</span><span class="brand-subtitle">GRAND</span></a><div style="display:flex;align-items:center;gap:14px"><span class="muted">Front desk</span><button class="btn ghost" id="logout" type="button" hidden>Sign out</button></div></header>
    <main class="section">
        <h2>Bookings</h2>
        <form id="k" class="card lookup" style="grid-template-columns:1fr auto"><input id="key" type="password"
                placeholder="Staff key" autocomplete="current-password" required><button class="btn">Sign in</button></form>
        <p class="msg" id="m" role="status" aria-live="polite"></p>
        <div class="card wrap" id="t" hidden>
            <table>
                <thead>
                    <tr>
                        <th>Ref</th>
                        <th>Guest</th>
                        <th>Room</th>
                        <th>Stay</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <h2 style="margin-top:36px">Kitchen orders</h2>
        <div class="card wrap" id="ot" hidden>
            <table>
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Guest</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ob"></tbody>
            </table>
        </div>
    </main>
    <script>
        const $ = s => document.querySelector(s), H = () => ({ 'Content-Type': 'application/json' }), e = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])), money = n => 'Rs ' + Number(n || 0).toLocaleString('en-LK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const bookingNext = { CONFIRMED: ['CHECKED_IN', 'CANCELLED', 'NO_SHOW'], CHECKED_IN: ['CHECKED_OUT'], CHECKED_OUT: [], CANCELLED: [], NO_SHOW: [] };
        const orderNext = { RECEIVED: ['PREPARING', 'CANCELLED'], PREPARING: ['READY'], READY: ['DELIVERED'], DELIVERED: [], CANCELLED: [] };
        let lastOrders = '', refreshTimer = null;
        async function api(url, body) {
            const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: H(), body: body ? JSON.stringify(body) : undefined }), j = await r.json();
            if (!r.ok) throw new Error(j.error || 'Request failed.');
            return j;
        }
        async function loadBookings() {
            const { bookings } = await api('/api/admin/bookings');
            $('#t').hidden = false;
            $('tbody').innerHTML = bookings.length ? bookings.map(b => {
                const options = [b.status, ...(bookingNext[b.status] || [])];
                return `<tr><td>${e(b.reference)}</td><td>${e(b.guest)}<br><small class="muted">${e(b.email)}</small></td><td>${e(b.roomName)} #${e(b.room)}</td><td>${e(b.checkIn)} to ${e(b.checkOut)}</td><td>${money(b.pricing.total)}</td><td><select data-r="${e(b.reference)}" data-current="${e(b.status)}" aria-label="Update booking ${e(b.reference)}">${options.map(s => `<option value="${s}" ${s === b.status ? 'selected' : ''}>${s.replace('_', ' ')}</option>`).join('')}</select></td></tr>`;
            }).join('') : '<tr><td colspan="6" class="empty">No bookings yet.</td></tr>';
        }
        async function loadOrders() {
            const { orders } = await api('/api/admin/orders'), signature = JSON.stringify(orders);
            $('#ot').hidden = false;
            if (signature === lastOrders) return;
            lastOrders = signature;
            $('#ob').innerHTML = orders.length ? orders.map(o => {
                const options = [o.status, ...(orderNext[o.status] || [])];
                return `<tr><td>${e(o.reference)}</td><td>${e(o.guest)}<br><small class="muted">${o.room ? 'Room ' + e(o.room) : 'Pickup'}</small></td><td>${o.lines.map(l => `${e(l.qty)} x ${e(l.name)}`).join('<br>')}${o.note ? '<br><small class="muted">Note: ' + e(o.note) + '</small>' : ''}</td><td>${money(o.pricing.total)}</td><td><select data-o="${e(o.reference)}" data-current="${e(o.status)}" aria-label="Update order ${e(o.reference)}">${options.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`;
            }).join('') : '<tr><td colspan="5" class="empty">No orders yet.</td></tr>';
        }
        async function refresh() {
            try { await Promise.all([loadBookings(), loadOrders()]); $('#m').textContent = ''; }
            catch (error) { $('#m').textContent = error.message; }
        }
        async function signIn(key) {
            try {
                await api('/api/admin/session', { key });
                $('#key').value = ''; $('#m').textContent = '';
                $('#k').hidden = true; $('#logout').hidden = false;
                await refresh();
                clearInterval(refreshTimer); refreshTimer = setInterval(refresh, 15000);
            } catch (error) { $('#m').textContent = error.message; }
        }
        $('#k').onsubmit = event => { event.preventDefault(); signIn($('#key').value); };
        $('#logout').onclick = async () => {
            try { await api('/api/admin/session/logout', {}); }
            catch (error) { $('#m').textContent = error.message; return; }
            clearInterval(refreshTimer); $('#k').hidden = false; $('#logout').hidden = true; $('#t').hidden = true; $('#ot').hidden = true; $('#m').textContent = 'You have signed out.';
        };
        $('tbody').onchange = async event => {
            const select = event.target, previous = select.dataset.current;
            try {
                await api(`/api/admin/bookings/${encodeURIComponent(select.dataset.r)}/status`, { status: select.value });
                select.dataset.current = select.value; await loadBookings();
            } catch (error) { $('#m').textContent = error.message; select.value = previous || 'CONFIRMED'; }
        };
        $('#ob').onchange = async event => {
            const select = event.target;
            const previous = select.dataset.current;
            try { await api(`/api/admin/orders/${encodeURIComponent(select.dataset.o)}/status`, { status: select.value }); select.dataset.current = select.value; lastOrders = ''; await loadOrders(); }
            catch (error) { $('#m').textContent = error.message; select.value = previous; }
        };
        (async () => {
            try {
                if ((await api('/api/admin/session')).authenticated) {
                    $('#k').hidden = true; $('#logout').hidden = false;
                    await refresh(); refreshTimer = setInterval(refresh, 15000);
                }
            } catch (error) {
                $('#m').textContent = error.message;
            }
        })();
    </script>
</body>

</html>
